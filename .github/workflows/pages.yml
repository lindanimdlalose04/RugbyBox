# Publishes Fantasy Rugby Box to GitHub Pages.
#
# The game is a static page in fantasy/web, with every answer it can give
# solved ahead of time, so publishing is just uploading that folder. There is
# no build step and nothing runs on a server.
#
# It runs when anything in fantasy/web changes on main, and can be run by
# hand from the Actions tab. Changes elsewhere, such as in dss/, do not
# republish the site.
#
# Needs Settings > Pages > Build and deployment > Source set to
# "GitHub Actions".
#
# The four actions below are released as a set and should be upgraded
# together. On 2026-11-21 older versions of them failed to publish twice: the
# package was uploaded, but the publish step could not find it. They also
# ran on a version of Node.js GitHub no longer supports.

name: Publish Fantasy Rugby Box

on:
  push:
    branches: [main]
    paths:
      - "fantasy/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A newer one waits rather than cutting the current
# one off half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the game
        uses: actions/upload-pages-artifact@v5
        with:
          path: fantasy/web

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
